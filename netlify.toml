# Netlify hosts only the React frontend. The Express API runs on Render (see render.yaml).
# Set VITE_API_URL in Netlify → Site configuration → Environment variables to the Render URL.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: send every route to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
